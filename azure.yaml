# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
#
# `azd up` workflow for the Research Agent Fan-out:
#
#   1. `azd up`
#        - Provisions infra/main.bicep (ACR, AOAI, ACA env, sandbox group, orchestrator app, role assignments)
#        - Builds & pushes the orchestrator image to ACR (server-side via `az acr build`)
#        - Builds & pushes the research-agent image to ACR (via the postprovision hook)
#        - Deploys the orchestrator image to the Container App
#
#   2. First request to the orchestrator
#        - Lifespan startup pre-warms a disk image from `acr/research-agent:latest`
#        - Subsequent runs reuse the disk image (digest-cached)
#
# To redeploy code only:  `azd deploy`
# To rebuild infra only:  `azd provision`
# To tear down:           `azd down`

name: aca-sandbox
metadata:
  template: aca-sandbox@1.0.0

infra:
  provider: bicep
  path: infra
  module: main

services:
  orchestrator:
    project: ./orchestrator
    language: python
    host: containerapp
    docker:
      path: Dockerfile
      context: .
      remoteBuild: true
      registry: ${AZURE_CONTAINER_REGISTRY_ENDPOINT}

hooks:
  # After infra is provisioned, build & push the research-agent image to ACR.
  # The orchestrator image is built+pushed automatically by `azd deploy` because
  # it's listed under `services` above.
  postprovision:
    posix:
      shell: sh
      run: |
        set -e
        ACR_NAME=$(azd env get-values | sed -n 's/^acrName="\(.*\)"/\1/p')
        RG_NAME=$(azd env get-values | sed -n 's/^AZURE_RESOURCE_GROUP="\(.*\)"/\1/p')
        if [ -z "$ACR_NAME" ]; then
          echo "ERROR: acrName not found in azd env. Did 'azd provision' succeed?" >&2
          exit 1
        fi
        echo "▸ Building research-agent image into $ACR_NAME (rg=$RG_NAME)..."
        if [ -n "$RG_NAME" ]; then
          az acr build --registry "$ACR_NAME" --resource-group "$RG_NAME" --image research-agent:latest ./research-agent
        else
          az acr build --registry "$ACR_NAME" --image research-agent:latest ./research-agent
        fi
    windows:
      shell: pwsh
      run: |
        # Use --no-logs to avoid the colorama/cp1252 charmap UnicodeEncodeError
        # when az CLI streams build logs through Windows console encoding.
        $vals = azd env get-values
        $acrName = ($vals | Select-String '^acrName="(.*)"').Matches.Groups[1].Value
        $rg = ($vals | Select-String '^AZURE_RESOURCE_GROUP="(.*)"').Matches.Groups[1].Value
        if (-not $acrName) { throw "acrName not found in azd env. Did 'azd provision' succeed?" }
        # Pass -g explicitly so the registry lookup ignores any stale `az` default group.
        $acrArgs = @('acr','build','--registry',$acrName,'--image','research-agent:latest','--no-logs')
        if ($rg) { $acrArgs += @('--resource-group',$rg) }
        Write-Host "Building research-agent image into $acrName (rg=$rg)..."
        az @acrArgs ./research-agent
        if ($LASTEXITCODE -ne 0) { throw "az acr build failed with exit code $LASTEXITCODE" }
        Write-Host "research-agent image built successfully."
